<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardianes de la Biblioteca</title><style>html,body{margin:0;height:100%;background:#07101d;color:white;font-family:system-ui;display:grid;place-items:center}.load{display:grid;gap:12px;text-align:center}.orb{font-size:48px}</style></head><body><div class="load"><div class="orb">🛡️</div><b>Abriendo Guardianes de la Biblioteca…</b></div><script>(async()=>{try{const names=['part-00.txt', 'part-01.txt', 'part-02.txt', 'part-03.txt', 'part-04.txt', 'part-05.txt', 'part-06.txt', 'part-07.txt', 'part-08.txt', 'part-09.txt', 'part-10.txt', 'part-11.txt', 'part-12.txt', 'part-13.txt', 'part-14.txt', 'part-15.txt', 'part-16.txt', 'part-17.txt', 'part-18.txt', 'part-19.txt'];const chunks=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));document.open();document.write(chunks.join(''));document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="orb">⚠️</div><b>No se pudo cargar el juego.</b><small>'+String(e)+'</small></div>'}})();</script></body></html>
