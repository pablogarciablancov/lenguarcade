<!doctype html><html lang="es"><meta charset="utf-8"><title>Lexaria · prueba de iframe</title><style>body{margin:0;background:#162334;color:white;font:14px system-ui}header{height:45px;display:flex;align-items:center;gap:10px;padding:0 12px}button{padding:5px}iframe{display:block;border:0;transform-origin:top left}#stage{height:calc(100vh - 45px);overflow:auto}</style><header>Prueba aislada de altura de iframe <button data-w="1280" data-h="650">1280 × 650</button><button data-w="1024" data-h="600">1024 × 600</button><button data-w="1366" data-h="768">1366 × 768</button><button data-w="390" data-h="700">390 × 700</button><output id="result"></output></header><div id="stage"><iframe id="game" title="Lexaria en iframe" src="../index.html" width="1280" height="650"></iframe></div><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{game.width=b.dataset.w;game.height=b.dataset.h;result.textContent='';});setInterval(()=>{try{const d=game.contentDocument,s=d.querySelector('.screen:not(.hidden)');result.textContent=s?`${s.id}: ${s.clientWidth}×${s.clientHeight} · contenido ${s.scrollWidth}×${s.scrollHeight}`:'';}catch{}},1000);</script></html>
