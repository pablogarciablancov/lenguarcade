<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entre Líneas · LenguArcade</title>
<style>
html,body{margin:0;min-height:100%;background:#09111d;color:#eef4fa;font-family:system-ui,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.loader{width:52px;height:52px;border:4px solid #31445d;border-top-color:#d7a942;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}small{color:#9db0c4}
</style>
</head>
<body>
<div id="boot"><div><div class="loader"></div><strong>Abriendo expediente…</strong><br><small>Conectando con LenguArcade</small></div></div>
<script>
(async()=>{
  const names=['payload-1.b64','payload-2.b64','payload-3.b64','payload-4.b64'];
  const parts=await Promise.all(names.map(async name=>{
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar '+name);
    return (await r.text()).trim();
  }));
  const binary=atob(parts.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.getElementById('boot').innerHTML='<div><strong>No se ha podido abrir Entre Líneas.</strong><p>'+String(error.message||error)+'</p></div>';
});
</script>
</body>
</html>
