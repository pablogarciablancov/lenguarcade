name: Guard concurrent game work

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce isolated game branch scope
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-game-scope.mjs
